# Giai đoạn 2: tiếp tục tinh chỉnh toàn bộ mô hình trên dữ liệu y khoa
phase:
  name: "phase_2"
  description: "Fine-tune toàn bộ ViT5-base trên dữ liệu CSV chuyên ngành."

model:
  # Điểm kiểm tra tốt nhất của giai đoạn 1 trên Kaggle
  name_or_path: /kaggle/input/notebooks/b22dccn128lngtindng/vit5-phase-1/outputs_phase_1/vit5_base/best
  use_fast_tokenizer: false
  trust_remote_code: false

data:
  # Các tập con được chia theo bài gốc để tránh rò rỉ dữ liệu giữa các đoạn
  train_file: "data/phase_2/train_*.*"
  valid_file: "data/phase_2/validation_*.*"
  test_file: "data/phase_2/test_*.*"
  source_prefix: "summarize: "
  max_source_length: 768
  max_target_length: 160

training:
  output_dir: "outputs/vit5_base"
  seed: 42
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2  # Kích thước lô hiệu dụng: 8/GPU
  learning_rate: 0.000005
  weight_decay: 0.005
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  label_smoothing_factor: 0.05
  precision: "auto"
  eval_strategy: "steps"
  eval_steps: 250
  save_strategy: "steps"
  save_steps: 250
  save_total_limit: 2
  logging_steps: 100
  metric_for_best_model: "rougeL"
  greater_is_better: true
  load_best_model_at_end: true
  early_stopping_patience: 5

generation:
  # Chỉ dùng khi sinh văn bản ở bước xác thực, kiểm thử hoặc suy luận
  max_length: 128
  min_length: 10
  num_beams: 4
  length_penalty: 1.0
  no_repeat_ngram_size: 3
  repetition_penalty: 1.0
  early_stopping: true

lora:
  enabled: false
